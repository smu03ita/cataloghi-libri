name: testi-esteri
# Per i libri dei cataloghi stranieri trovati dal confronto: descrizioni e copertine (indirizzi) di Open Library, e trame da
# Wikipedia (una lingua per lavoro, 50 pagine per richiesta). Risultati nel Drive: cataloghi/_confronto/testi/.
# Parte a mano o cambiando avvia/testi.txt. Segreto: RCLONE_CONF.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['avvia/testi.txt']
permissions:
  contents: read
concurrency:
  group: testi-esteri
  cancel-in-progress: false
env:
  BASE: 'drive:Fabula App/cataloghi'
jobs:
  open_library:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          sudo apt-get install -y -qq pigz > /dev/null
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          pip install -q pandas numpy requests
      - name: Accesso al Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: Descrizioni e copertine
        env:
          OL_EDIZIONI: 'drive:Fabula App/cataloghi/Inglese - Open Library/2026-09-30/ol_dump_editions_2026-09-30.txt.gz'
          OL_OPERE: 'drive:Fabula App/cataloghi/Inglese - Open Library/2026-09-30/ol_dump_works_2026-09-30.txt.gz'
        run: |
          mkdir -p "$RUNNER_TEMP/trovati"
          rclone copy "$BASE/_confronto" "$RUNNER_TEMP/trovati" --include "trovati_*.tsv.gz"
          export TROVATI="$RUNNER_TEMP/trovati" USCITA="$RUNNER_TEMP/testi" LAVORO="$RUNNER_TEMP/lavoro"
          cd "$RUNNER_TEMP" && python3 -u "$GITHUB_WORKSPACE/strumenti/testi_ol_esteri.py"
          rclone copy "$RUNNER_TEMP/testi" "$BASE/_confronto/testi"

  wikipedia:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        lingua: [de, fr, en, pl, pt, nl, et]
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          pip install -q requests mwparserfromhell
      - name: Accesso al Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: Trame
        env:
          LINGUA: ${{ matrix.lingua }}
        run: |
          mkdir -p "$RUNNER_TEMP/trovati"
          rclone copy "$BASE/_confronto" "$RUNNER_TEMP/trovati" --include "trovati_*.tsv.gz"
          python3 -u strumenti/trame_estere.py "$LINGUA" "$RUNNER_TEMP/trovati" "$RUNNER_TEMP/testi"
          rclone copy "$RUNNER_TEMP/testi" "$BASE/_confronto/testi"
