name: conta-unico
# File unico dei libri italiani: OPAC SBN + ISBNdb + selezione (Open Library, Wikipedia), senza doppioni
# (strumenti/unico.py). Non chiama nessun servizio esterno: legge solo il Drive. Parte a mano.
# Scrive cataloghi/Italia/unico/: opere_unite.jsonl.gz, opere_con_sinossi.csv, riepilogo_unico.json.
# Segreto: RCLONE_CONF.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conta-unico
  cancel-in-progress: false
jobs:
  unico:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: curl -s https://rclone.org/install.sh | sudo bash > /dev/null
      - name: Accesso al Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: File unico
        run: python3 -u strumenti/unico.py
