name: opac-sbn
# Schede complete dall'OPAC SBN (UNIMARC via Z39.50). Tutto nel Drive (cataloghi/Italia/schede_complete):
# l'ordine dei libri, cosa è già fatto, le schede, il riepilogo di ogni giro. Riprende sempre da dove era arrivato;
# se il server non risponde o rifiuta le ricerche si ferma subito e riprova 10 minuti dopo, a qualunque ora; se va tutto
# bene, alla fine di ogni giro ne parte subito un altro. Sempre un giro alla volta (concurrency). Vedi strumenti/opac_sbn.py.
# 27/10 sera (fondatore: finire tutta la coda in circa 2 giorni): dentro il giro più connessioni in parallelo dallo stesso computer,
# da 4 fino a OPAC_CONNESSIONI; il numero sale di 2 a ogni giro regolare e scende da solo se il server rallenta, dà errori o
# smette di rispondere (schede_complete/connessioni.json).
# Segreto: RCLONE_CONF (accesso al Drive).
on:
  schedule:
    - cron: '*/10 * * * *'   # 27/10 pomeriggio (fondatore): un tentativo ogni 10 minuti, giorno e notte; se il server risponde,
                             # alla fine di ogni giro ne parte subito un altro (passo "Giro successivo"); se rifiuta, ci si ferma
                             # e si riprova al tentativo dopo. Un giro alla volta: i tentativi che arrivano durante un giro aspettano.
  workflow_dispatch:
  push:                        # per far partire un giro a mano: cambiare avvia/opac.txt
    branches: [main]
    paths: ['avvia/opac.txt']
permissions:
  contents: read
  actions: write          # per far partire il giro successivo
concurrency:
  group: opac-sbn
  cancel-in-progress: false
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 70        # 54 di giro + al massimo 10 di attesa prima di riprovare
    steps:
      - name: Controllo del segreto
        id: segreti
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "Manca il segreto RCLONE_CONF: niente da fare."; echo "ok=no" >> "$GITHUB_OUTPUT"
          else echo "ok=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.segreti.outputs.ok == 'si'
      - name: Strumenti
        if: steps.segreti.outputs.ok == 'si'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq yaz > /dev/null
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          pip install -q pymarc
      - name: Accesso al Drive
        if: steps.segreti.outputs.ok == 'si'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: Schede complete
        if: steps.segreti.outputs.ok == 'si'
        env:
          SBN_SELEZIONE_DA: 'selezione_2026-10-26'   # le selezioni più vecchie non si usano
          OPAC_CONNESSIONI: '30'                     # numero normale (28/10 12:56, il fondatore: 30; prima 15)
          OPAC_PROVA_CONNESSIONI: '150'              # 28/10 16:52 (il fondatore): 150 connessioni fino alle 20:00 (prima 100); dice di avere la conferma
                                                     # del Servizio bibliotecario nazionale (non condivisibile)
          OPAC_PROVA_FINO: '2026-11-15T00:00:00Z'    # 28/10 16:54 (il fondatore): 150 anche dopo le 20:00, fino alla fine della coda
                                                     # (codici 88 compresi); se per più di un'ora non arriva nessuna scheda,
                                                     # si torna a 30 (regola del fondatore)
          OPAC_LENTO: '2.5'                          # se il server rallenta per tutti (oltre 2,5 s per scheda) si scende…
          OPAC_RIENTRO: '30'                         # …a 30 connessioni, nel giro stesso
          OPAC_FISSO: 'si'                           # sempre il massimo, senza salita né freno
        run: |
          set -o pipefail
          python3 -u strumenti/opac_sbn.py --minuti 54 2>&1 | tee "$RUNNER_TEMP/opac.log"
      - name: Giro successivo
        if: steps.segreti.outputs.ok == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/continua" ]; then gh workflow run opac-sbn.yml --ref main -R "$GITHUB_REPOSITORY" && echo "giro successivo avviato"
          elif [ -f "$RUNNER_TEMP/riprova" ]; then
            # il server non risponde: si riprova tra 10 minuti senza contare sui tentativi programmati, che GitHub spesso salta
            echo "server fermo: riprovo tra 10 minuti"; sleep 600
            gh workflow run opac-sbn.yml --ref main -R "$GITHUB_REPOSITORY" && echo "nuovo tentativo avviato"
          fi
      - name: Registro
        if: always() && steps.segreti.outputs.ok == 'si'
        run: |
          f="$RUNNER_TEMP/opac.log"
          [ -f "$f" ] || exit 0
          python3 strumenti/registro_pulito.py "$f"
          rclone copyto "$f" "drive:Fabula App/cataloghi/Italia/registri/opac_$(date -u +%Y%m%d_%H%M).log"
