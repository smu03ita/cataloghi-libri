name: isbndb-elenco
# Solo l'elenco pulito e il riepilogo dei libri già raccolti da ISBNdb (strumenti/isbndb_elenco.py), senza chiamare ISBNdb.
# Serve per vedere i numeri mentre la raccolta è ancora in corso (la raccolta lo rifà comunque alla fine di ogni giro).
# Segreto: RCLONE_CONF (accesso al Drive).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isbndb-elenco
  cancel-in-progress: false
jobs:
  elenco:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Controllo del segreto
        id: segreti
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::notice::Manca il segreto RCLONE_CONF: niente da fare."; echo "ok=no" >> "$GITHUB_OUTPUT"
          else echo "ok=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.segreti.outputs.ok == 'si'
      - name: Strumenti
        if: steps.segreti.outputs.ok == 'si'
        run: curl -s https://rclone.org/install.sh | sudo bash > /dev/null
      - name: Accesso al Drive
        if: steps.segreti.outputs.ok == 'si'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: Elenco pulito
        if: steps.segreti.outputs.ok == 'si'
        run: |
          out=$(python3 -u strumenti/isbndb_elenco.py 2>&1 | tail -3); echo "$out"
          echo "::notice title=elenco ISBNdb::$(echo "$out" | tail -1)"
