name: conta-opac
# Conta le schede complete OPAC SBN scaricate e quante hanno la presentazione (strumenti/conta_opac.py).
# Parte a mano. Scrive solo schede_complete/riepilogo_opac.json. Segreto: RCLONE_CONF.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: curl -s https://rclone.org/install.sh | sudo bash > /dev/null
      - name: Accesso al Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: Conta
        run: python3 -u strumenti/conta_opac.py
