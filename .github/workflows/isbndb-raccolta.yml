name: isbndb-raccolta
# Libri in italiano da ISBNdb per Fabula: tutti i romance, poi le novità dal 2024 e a ritroso. Tutto nel Drive
# (cataloghi/Italia/isbndb): grezzi, stato per riprendere, elenco pulito (JSONL e CSV) e riepilogo. Vedi strumenti/isbndb_raccolta.py.
# Il piano Basic ha 5.000 chiamate al giorno, condivise con gli altri lavori: a quota quasi finita il giro si ferma e
# il lavoro riprova da solo ogni ora finché la quota torna disponibile; a tempo finito ne parte subito un altro.
# Dal 27/10 scarica anche le copertine grandi dei libri utili mentre raccoglie (strumenti/isbndb_copertine.py).
# Segreti: ISBNDB_API_KEY (chiave ISBNdb), RCLONE_CONF (accesso al Drive).
on:
  schedule:
    - cron: '41 5,17 * * *'      # due volte al giorno: riprende quando la quota del giorno è di nuovo disponibile
  workflow_dispatch:
  push:                          # per far partire un giro a mano: cambiare avvia/isbndb.txt
    branches: [main]
    paths: ['avvia/isbndb.txt']
permissions:
  contents: read
  actions: write                 # per far partire il giro successivo
concurrency:
  group: isbndb-raccolta
  cancel-in-progress: false
jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Precedenza alle copertine
        id: attesa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 28/10 (Paolo): prima le copertine grandi dei libri già raccolti, poi la raccolta. Le due cose insieme superano
          # il limite di ISBNdb (una chiamata al secondo): se il rinnovo delle copertine è in corso, si riprova tra 15 minuti.
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow isbndb-copertine.yml --status in_progress --json databaseId --jq 'length')
          if [ "$n" != "0" ]; then
            echo "copertine in corso: la raccolta aspetta"; sleep 900
            gh workflow run isbndb-raccolta.yml --ref main -R "$GITHUB_REPOSITORY"; echo "aspetta=si" >> "$GITHUB_OUTPUT"
          else echo "aspetta=no" >> "$GITHUB_OUTPUT"; fi
      - name: Controllo dei segreti
        if: steps.attesa.outputs.aspetta == 'no'
        id: segreti
        env:
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$ISBNDB_API_KEY" ]; then echo "::notice::Manca il segreto ISBNDB_API_KEY: niente da fare."; echo "ok=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$RCLONE_CONF" ]; then echo "::notice::Manca il segreto RCLONE_CONF: niente da fare."; echo "ok=no" >> "$GITHUB_OUTPUT"
          else echo "ok=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.segreti.outputs.ok == 'si'
      - name: Strumenti
        if: steps.segreti.outputs.ok == 'si'
        run: |
          date +%s > "$RUNNER_TEMP/inizio"
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          pip install -q pillow
      - name: Accesso al Drive
        if: steps.segreti.outputs.ok == 'si'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python3 strumenti/rclone_conf.py
      - name: Raccolta
        if: steps.segreti.outputs.ok == 'si'
        env:
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
          RISERVA: '0'             # 30/10 (Paolo): usare tutte le chiamate del giorno, niente riserva (prima 300 per la scheda libri dell'app)
          ANNO_MINIMO: '2000'      # fin dove andare a ritroso
          COPERTINE: 'si'          # 27/10: copertine grandi scaricate subito, mentre i link sono validi (2 ore)
          EDITORI: 'no'            # 30/10 (Paolo): pubblicazioni recenti per data, non per editore: novità 2023, 2022, 2021, 2020…
                                   # e a ritroso. Le ricerche per editore 2024–2026 restano da parte (editori_rimandati), non perse.
        run: |
          set -o pipefail
          python3 -u strumenti/isbndb_raccolta.py --minuti 300 2>&1 | tee "$RUNNER_TEMP/isbndb.log"
      - name: Elenco pulito
        if: always() && steps.segreti.outputs.ok == 'si'
        run: |
          # solo se il giro ha salvato libri nuovi (i tentativi a quota finita non ne salvano)
          if [ -f "$RUNNER_TEMP/isbndb/nuovi" ]; then python3 -u strumenti/isbndb_elenco.py 2>&1 | tee -a "$RUNNER_TEMP/isbndb.log"; fi
      - name: Giro successivo
        if: steps.segreti.outputs.ok == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/isbndb/continua" ]; then gh workflow run isbndb-raccolta.yml --ref main -R "$GITHUB_REPOSITORY" && echo "giro successivo avviato"
          elif [ -f "$RUNNER_TEMP/isbndb/riprova" ]; then
            # quota del giorno finita: si riprova tra un'ora (al massimo), senza contare sui tentativi programmati che GitHub salta
            passati=$(( $(date +%s) - $(cat "$RUNNER_TEMP/inizio") )); attesa=$(( 355 * 60 - passati - 600 ))
            [ $attesa -gt 3600 ] && attesa=3600
            if [ $attesa -gt 0 ]; then echo "quota finita: riprovo tra $((attesa / 60)) minuti"; sleep $attesa; fi
            gh workflow run isbndb-raccolta.yml --ref main -R "$GITHUB_REPOSITORY" && echo "nuovo tentativo avviato"
          fi
      - name: Registro
        if: always() && steps.segreti.outputs.ok == 'si'
        run: |
          f="$RUNNER_TEMP/isbndb.log"
          [ -f "$f" ] || exit 0
          python3 strumenti/registro_pulito.py "$f"
          rclone copyto "$f" "drive:Fabula App/cataloghi/Italia/registri/isbndb_$(date -u +%Y%m%d_%H%M).log"
